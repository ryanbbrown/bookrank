events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        font/woff2                            woff2;
    }

    default_type application/octet-stream;

    error_log C:/Users/ryanb/Desktop/new_code/bookrank/app/config/logs/error.log debug;

    server {
        listen 80;

        server_name localhost;

        location / {
            root C:/Users/ryanb/Desktop/new_code/bookrank/app/my-app/build;
            try_files $uri /index.html;
        }

        location /static/ {
            alias C:/Users/ryanb/Desktop/new_code/bookrank/app/my-app/build/static/;
        }

        location /api/ {
            # proxy_pass http://127.0.0.1:8000;
            proxy_pass http://unix:/mnt/c/Users/ryanb/Desktop/new_code/bookrank/djangoapp/gunicorn.sock;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-CSRFToken $http_x_csrf_token;  # Forward the CSRF token
            proxy_set_header Cookie $http_cookie;  # Forward cookies
            proxy_set_header Authorization $http_authorization;  # Forward the Authorization header
            proxy_set_header Origin $http_origin;  # Forward the Origin header
            proxy_set_header Referer $http_referer;  # Forward the Referer header
        }
    }
}
